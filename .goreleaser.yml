# GoReleaser Configuration for Conform
project_name: conform
builds:
  - skip: true

release:
  github:
    owner: alicanli1995
    name: conform
  mode: replace
  footer: |
    ## Installation

    ```bash
    go get github.com/alicanli1995/conform@{{ .Tag }}
    ```

    Full documentation: https://github.com/alicanli1995/conform

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

