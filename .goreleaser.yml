project_name: conform

before:
  hooks:
    - go mod download

builds:
  - id: conform-validate
    main: ./cmd/conform-validate
    binary: conform-validate
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    skip:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    builds:
      - conform-validate
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: alicanli1995
    name: conform
  prerelease: auto

