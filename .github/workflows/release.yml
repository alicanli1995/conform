name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install GitHub CLI
        if: always()
        run: |
          if ! command -v gh &> /dev/null; then
            echo "📥 Installing GitHub CLI..."
            type -p curl >/dev/null || (apt update && apt install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && apt update \
            && apt install gh -y
          else
            echo "✅ GitHub CLI already installed"
          fi

      - name: Create or update release
        if: always()
        run: |
          # Get the tag that was just pushed
          TAG=$(git describe --tags --abbrev=0)
          echo "🔖 Processing release for tag: $TAG"
          
          # Wait a bit for GitHub API to be ready
          sleep 2
          
          # Check if release already exists
          RELEASE_ID=$(gh api repos/alicanli1995/conform/releases/tags/$TAG --jq '.id' 2>/dev/null || echo "")
          
          if [[ -n "$RELEASE_ID" && "$RELEASE_ID" != "null" ]]; then
            echo "✅ Release already exists with ID: $RELEASE_ID"
            echo "🔄 Updating release..."
            
            # Update existing release
            gh api repos/alicanli1995/conform/releases/$RELEASE_ID \
              -X PATCH \
              -f prerelease=false \
              -f draft=false \
              -f tag_name=$TAG \
              -f name="Release $TAG" \
              -f body="## Installation

\`\`\`bash
go get github.com/alicanli1995/conform@$TAG
\`\`\`

Full documentation: https://github.com/alicanli1995/conform"
            
            echo "✅ Release $TAG updated"
          else
            echo "📦 Creating new release for tag: $TAG"
            
            # Get changelog from commits since last tag
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            
            if [[ -n "$PREVIOUS_TAG" ]]; then
              CHANGELOG=$(git log ${PREVIOUS_TAG}..${TAG} --pretty=format:"- %s (%h)" --reverse | head -20)
              BODY="## Changes since $PREVIOUS_TAG

$CHANGELOG

## Installation

\`\`\`bash
go get github.com/alicanli1995/conform@$TAG
\`\`\`

Full documentation: https://github.com/alicanli1995/conform"
            else
              BODY="## Installation

\`\`\`bash
go get github.com/alicanli1995/conform@$TAG
\`\`\`

Full documentation: https://github.com/alicanli1995/conform"
            fi
            
            # Create new release
            gh api repos/alicanli1995/conform/releases \
              -X POST \
              -f tag_name=$TAG \
              -f name="Release $TAG" \
              -f body="$BODY" \
              -f prerelease=false \
              -f draft=false
            
            echo "✅ Release $TAG created successfully"
            
            # Wait a bit and verify
            sleep 2
            RELEASE_ID=$(gh api repos/alicanli1995/conform/releases/tags/$TAG --jq '.id' 2>/dev/null || echo "")
            if [[ -n "$RELEASE_ID" && "$RELEASE_ID" != "null" ]]; then
              echo "✅ Release verified: ID $RELEASE_ID"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
