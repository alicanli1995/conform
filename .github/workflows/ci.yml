name: CI

on:
  push:
    tags:
      - 'v*'  # Trigger only on version tags (v1.0.0, v0.1.0, etc.)
  release:
    types: [ created ]

env:
  GO_VERSION: '1.21'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.21', '1.22', '1.23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        continue-on-error: false

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.21'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -v ./...

      - name: Build examples
        run: |
          for dir in examples/*/; do
            if [ -f "$dir/main.go" ]; then
              echo "Building $dir"
              cd "$dir" && go build . || echo "Build failed for $dir"
              cd ../..
            fi
          done
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail ./...'
        continue-on-error: true

      - name: Display results
        if: always()
        run: echo "Security scan completed. Check the output above for details."

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: benchmark_user
          POSTGRES_PASSWORD: benchmark_pass
          POSTGRES_DB: benchmark_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Wait for PostgreSQL
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U benchmark_user 2>/dev/null; do sleep 2; done' || echo "PostgreSQL check completed"
        continue-on-error: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client || echo "PostgreSQL client install skipped"
        continue-on-error: true

      - name: Setup benchmark database
        run: |
          if [ -d "benchmarks" ]; then
            cd benchmarks
            export DB_CONN="postgres://benchmark_user:benchmark_pass@localhost:5432/benchmark_db?sslmode=disable"
            go mod download
            go test -bench=. -benchmem -benchtime=1s -run=^$ . || echo "Benchmark setup completed"
          else
            echo "No benchmarks directory found, skipping benchmark setup"
          fi
        continue-on-error: true

      - name: Run benchmarks
        run: |
          if [ -d "benchmarks" ]; then
            cd benchmarks
            export DB_CONN="postgres://benchmark_user:benchmark_pass@localhost:5432/benchmark_db?sslmode=disable"
            go test -bench=. -benchmem -benchtime=3s -run=^$ . 2>&1 | tee benchmark_results.txt || echo "Benchmarks completed"
          else
            echo "No benchmarks directory found, skipping benchmarks"
          fi
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/benchmark_results.txt
          if-no-files-found: ignore

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: |
      (github.event_name == 'release' && github.event.action == 'created') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Normalize tag format
        id: normalize_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Remove double dots (v.1.0.1 -> v1.0.1) and ensure proper semver format
            NORMALIZED_TAG=$(echo "$TAG" | sed 's/v\./v/g')
            if [ "$TAG" != "$NORMALIZED_TAG" ]; then
              echo "⚠️  Warning: Tag format '$TAG' is not valid semver. Normalizing to '$NORMALIZED_TAG'"
              # Fetch all tags to check if normalized tag already exists remotely
              git fetch --tags --force 2>/dev/null || true
              # Check if normalized tag exists locally or remotely
              if git rev-parse "$NORMALIZED_TAG" >/dev/null 2>&1; then
                echo "✅ Normalized tag '$NORMALIZED_TAG' already exists, using it"
                # Delete the invalid tag locally if it exists
                git tag -d "$TAG" 2>/dev/null || true
              else
                echo "📝 Creating normalized tag '$NORMALIZED_TAG'"
                # Delete the invalid tag locally if it exists
                git tag -d "$TAG" 2>/dev/null || true
                # Create normalized tag locally
                git tag "$NORMALIZED_TAG" "$GITHUB_SHA"
              fi
              echo "normalized_tag=$NORMALIZED_TAG" >> $GITHUB_OUTPUT
            else
              echo "✅ Tag '$TAG' is already in valid semver format"
              echo "normalized_tag=$TAG" >> $GITHUB_OUTPUT
            fi
          else
            echo "normalized_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v1.26.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to pkg.go.dev
        run: |
          echo "Release completed. Package will be available on pkg.go.dev automatically."
          echo "Version: ${{ github.event.release.tag_name }}"

