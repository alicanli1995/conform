name: Test

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -o bin/conform-validate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/conform-validate

  create-tag:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Fetch all tags
          git fetch --tags --depth=100
          
          # Get the latest tag (sorted by version)
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -1)
          
          if [[ -z "$LATEST_TAG" ]]; then
            LATEST_TAG="v0.0.0"
            echo "⚠️ No tags found, starting from v0.0.0"
          else
            echo "📌 Latest tag: $LATEST_TAG"
          fi
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Extract version numbers (remove 'v' prefix)
          VERSION=${LATEST_TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Split version into parts
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

      - name: Extract tag from commit message
        id: extract_tag
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "📝 Commit message: $COMMIT_MSG"
          
          # Extract version tag from commit message (supports: v1.0.0, Release v1.0.0, version 1.0.0, etc.)
          TAG=$(echo "$COMMIT_MSG" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          
          # Always set tag_exists output (default to false)
          echo "tag_exists=false" >> $GITHUB_OUTPUT
          echo "tag=" >> $GITHUB_OUTPUT
          
          if [[ -n "$TAG" ]]; then
            # Ensure tag starts with 'v'
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v$TAG"
            fi
            
            echo "✅ Found tag in commit message: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # No tag in commit message - auto-increment patch version
          echo "⚠️ No version tag found in commit message"
          echo "🔄 Auto-incrementing patch version..."
          
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          MAJOR="${{ steps.get_latest_tag.outputs.major }}"
          MINOR="${{ steps.get_latest_tag.outputs.minor }}"
          PATCH="${{ steps.get_latest_tag.outputs.patch }}"
          
          # Check commit message for version bump type
          if echo "$COMMIT_MSG" | grep -qiE '(breaking|major|major version)'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            echo "🚀 Major version bump detected"
          elif echo "$COMMIT_MSG" | grep -qiE '(feature|minor|minor version|new)'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            echo "✨ Minor version bump detected"
          else
            PATCH=$((PATCH + 1))
            echo "🔧 Patch version bump (default)"
          fi
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "✅ Auto-generated tag: $NEW_TAG (from $LATEST_TAG)"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "tag_exists=true" >> $GITHUB_OUTPUT
          
          echo "🔍 Debug - tag_exists output: true"
          echo "🔍 Debug - tag output: $NEW_TAG"

      - name: Debug outputs
        if: always()
        run: |
          echo "🔍 Debug - extract_tag.outputs.tag_exists: ${{ steps.extract_tag.outputs.tag_exists }}"
          echo "🔍 Debug - extract_tag.outputs.tag: ${{ steps.extract_tag.outputs.tag }}"
          echo "🔍 Debug - Output check: tag_exists='${{ steps.extract_tag.outputs.tag_exists }}'"

      - name: Check if tag already exists
        id: check_tag
        if: steps.extract_tag.outputs.tag_exists == 'true'
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          echo "🔍 Checking if tag exists: $TAG"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG already exists"
            echo "tag_exists_remote=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Tag $TAG does not exist, will create"
            echo "tag_exists_remote=false" >> $GITHUB_OUTPUT
          fi
          
          echo "🔍 Debug - tag_exists_remote: ${{ steps.check_tag.outputs.tag_exists_remote }}"

      - name: Create and push tag
        if: steps.extract_tag.outputs.tag_exists == 'true' && steps.check_tag.outputs.tag_exists_remote == 'false'
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          echo "🚀 Creating tag: $TAG"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          
          echo "✅ Successfully created and pushed tag: $TAG"

